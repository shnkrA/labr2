events {
    worker_connections 1024;
}

http {
    upstream backend_service {
        # Використовуємо мережеве ім'я контейнера backend
        server backend:5000;
    }

    server {
        listen 80;

        # Маршрутизація для API (Завдання 2: /api/info та /api/users)
        location /api/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Healthcheck для шлюзу
        location /health {
            return 200 'gateway healthy\n';
        }
    }
}